# GitHub Actions Workflow: CI Build (no packaging or release)
# - Builds on ubuntu, macos and windows runners using a matrix
# - On push to refs/heads/** triggers builds on all branches
# - On pull requests to main or develop, triggers builds for those branches
# - No packaging or release creation; meant for fast CI checks

name: CI Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    name: Build (matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    outputs:
      build_id: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      # Android SDK is preinstalled on ubuntu-latest (Android SDK 36.1 for this project)

#      - name: Build project (compile & unit-build)
#        run: |
#          # Run the build but skip packaging and release APK creation so CI doesn't produce installers
#          ./gradlew --no-daemon --stacktrace build
