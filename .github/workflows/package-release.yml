# GitHub Actions Workflow: Package installers and create a draft release
# - Runs only on pushes to release branches (refs/heads/release/**)
# - Builds APK (Android) and native installers (DEB/DMG/MSI)
# - Uploads artifacts and creates a draft GitHub Release with attached assets

name: Package & Draft Release

on:
  push:
    branches: [ 'release/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  package-ubuntu:
    name: Package (Ubuntu) - DEB
    runs-on: ubuntu-latest
    outputs:
      artifacts-path: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ubuntu-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ubuntu-

      - name: Build DEB (Ubuntu)
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon --stacktrace :composeApp:packageDeb

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-artifacts
          path: |
            composeApp/build/compose/binaries/**/*.deb
          retention-days: 14

  package-android:
    name: Package (Android) - APK
    runs-on: ubuntu-latest
    outputs:
      artifacts-path: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Build APK
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon --stacktrace :androidApp:assembleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-artifacts
          path: |
            androidApp/build/outputs/apk/release/*.apk
          retention-days: 14

  package-macos:
    name: Package (macOS) - DMG
    runs-on: macos-latest
    outputs:
      artifacts-path: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build DMG (macOS)
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon --stacktrace :composeApp:packageDmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-artifacts
          path: |
            composeApp/build/compose/binaries/**/*.dmg
          retention-days: 14

  package-windows:
    name: Package (Windows) - MSI
    runs-on: windows-latest
    outputs:
      artifacts-path: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install WiX (Windows only)
        shell: powershell
        run: |
          choco install -y wixtoolset

      - name: Build MSI (Windows)
        shell: powershell
        run: |
          .\gradlew.bat --no-daemon --stacktrace :composeApp:packageMsi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-artifacts
          path: |
            composeApp/build/compose/binaries/**/*.msi
          retention-days: 14

  create_release:
    name: Create Draft Release and Attach Artifacts
    needs: [ package-ubuntu, package-macos, package-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

