# GitHub Actions Workflow: Package installers and create a draft release
# - Runs only on pushes to release branches (refs/heads/release/**)
# - Builds APK (Android) and native installers (DEB/DMG/MSI)
# - Uploads artifacts and creates a draft GitHub Release with attached assets

name: Package & Draft Release

on:
  push:
    branches: [ 'release/**', "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  package-ubuntu:
    name: Package (Ubuntu) - DEB
    runs-on: ubuntu-latest
    outputs:
      artifacts-path: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ubuntu-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ubuntu-

      - name: Build DEB (Ubuntu)
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon --stacktrace :composeApp:packageReleaseDeb

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-artifacts
          path: |
            composeApp/build/compose/binaries/**/*.deb
          retention-days: 14

  package-android:
    name: Package (Android) - APK
    runs-on: ubuntu-latest
    outputs:
      artifacts-path: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Build APK
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon --stacktrace :androidApp:assembleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-artifacts
          path: |
            androidApp/build/outputs/apk/release/*.apk
          retention-days: 14

  package-js:
    name: Package (JS) - ZIP
    runs-on: ubuntu-latest
    outputs:
      artifacts-path: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-js-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-js-

      - name: Build JS
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon --stacktrace :composeApp:jsBrowserDistribution

      - name: Upload JS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: js-artifacts
          path: |
            composeApp/build/dist/js/productionExecutable/**
          retention-days: 14

  package-js-wasm:
    name: Package (WASM) - ZIP
    runs-on: ubuntu-latest
    outputs:
      artifacts-path: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wasm-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wasm-

      - name: Build WASM
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon --stacktrace :composeApp:wasmJsBrowserDistribution

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wasm-artifacts
          path: |
            composeApp/build/dist/wasmJs/productionExecutable/**
          retention-days: 14

  package-macos:
    name: Package (macOS) - DMG
    runs-on: macos-latest
    outputs:
      artifacts-path: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build DMG (macOS)
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon --stacktrace :composeApp:packageReleaseDmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-artifacts
          path: |
            composeApp/build/compose/binaries/**/*.dmg
          retention-days: 14

  package-windows:
    name: Package (Windows) - MSI
    runs-on: windows-latest
    outputs:
      artifacts-path: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build MSI (Windows)
        shell: powershell
        run: |
          .\gradlew.bat --no-daemon --stacktrace :composeApp:packageReleaseMsi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-artifacts
          path: |
            composeApp/build/compose/binaries/**/*.msi
          retention-days: 14

  # Prepare a draft release for GitHub Releases page for the manual verification
  # If accepted and published, the release workflow would be triggered
  releaseDraft:
    name: Release draft
    if: ${{ (startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main') && github.event_name != 'pull_request' }}
    needs: [ package-android, package-js, package-js-wasm, package-ubuntu, package-macos, package-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      # Remove old release drafts by using the curl request for the available releases with a draft flag
      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      # Create a new release draft - which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          RELEASE_NOTE="./build/tmp/release_note.txt"
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file=$RELEASE_NOTE
          
          gh release create $VERSION artifacts/* \
          --draft \
          --title $VERSION \
          --notes-file $RELEASE_NOTE
